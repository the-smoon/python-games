openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /playlists/library:
    get:
      operationId: getMusicLibrary
      responses:
        "200":
          description: Library tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriveTrack"
  /song-analysis/{hash}:
    get:
      operationId: getSongAnalysis
      parameters:
        - $ref: "#/components/parameters/AudioHash"
      responses:
        "200":
          description: Cached numerical song analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongAnalysisDocument"
        "404":
          description: Song has not been analyzed with this analyzer version
    put:
      operationId: storeSongAnalysis
      parameters:
        - $ref: "#/components/parameters/AudioHash"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongAnalysisDocument"
      responses:
        "200":
          description: Stored immutable analysis, or the existing document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongAnalysisDocument"
  /run-scores:
    post:
      operationId: submitRunScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunScoreInput"
      responses:
        "201":
          description: Run score saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunScore"
        "200":
          description: This run was already saved; the original score is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunScore"
        "400":
          description: Invalid run score
        "403":
          description: Cross-origin submission rejected
        "429":
          description: Submission limit reached
        "503":
          description: Score storage is temporarily unavailable
  /playlists/audio/{id}:
    get:
      operationId: getDriveAudio
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: MP3, at most 24 MB and 12 minutes
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
  /playlists:
    get:
      operationId: listSharedPlaylists
      responses:
        "200":
          description: Shared playlist names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaylistSummary"
    post:
      operationId: saveSharedPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePlaylistInput"
      responses:
        "201":
          description: Saved without overwriting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistSummary"
  /playlists/{id}:
    get:
      operationId: loadSharedPlaylist
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Ordered referenced tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlaylist"
  /playlists/owner:
    get:
      operationId: getOwnerStatus
      responses:
        "200":
          description: Owner session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerStatus"
    post:
      operationId: ownerSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerLoginInput"
      responses:
        "200":
          description: Owner session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerStatus"
    delete:
      operationId: ownerSignOut
      responses:
        "204":
          description: Signed out
  /playlists/upload:
    post:
      operationId: uploadOwnerMp3
      parameters:
        - name: X-Filename
          in: header
          required: true
          schema:
            type: string
            description: URI-encoded MP3 filename
      requestBody:
        required: true
        content:
          audio/mpeg:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Uploaded to the designated music folder; owner cookie required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveTrack"
components:
  parameters:
    AudioHash:
      name: hash
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,200}$"
  schemas:
    AudioFingerprint:
      type: object
      additionalProperties: false
      required: [rms, onset, low, mid, high, centroid, flatness, pulse, tempo]
      properties:
        rms: { type: number, minimum: 0, maximum: 1 }
        onset: { type: number, minimum: 0, maximum: 1 }
        low: { type: number, minimum: 0, maximum: 1 }
        mid: { type: number, minimum: 0, maximum: 1 }
        high: { type: number, minimum: 0, maximum: 1 }
        centroid: { type: number, minimum: 0, maximum: 1 }
        flatness: { type: number, minimum: 0, maximum: 1 }
        pulse: { type: boolean }
        tempo: { type: number, minimum: 0, maximum: 300 }
    SongAnalysisDocument:
      type: object
      additionalProperties: false
      required: [version, duration, signature, motifs, analyzedSeconds]
      properties:
        version: { type: integer, enum: [1] }
        duration: { type: number, minimum: 1, maximum: 720 }
        analyzedSeconds: { type: number, minimum: 0.001, maximum: 720 }
        signature:
          $ref: "#/components/schemas/AudioFingerprint"
        motifs:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: "#/components/schemas/AudioFingerprint"
    RunScoreInput:
      type: object
      additionalProperties: false
      required: [runId, name, score, levelReached, bossLevelReached]
      properties:
        runId:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        name:
          type: string
          minLength: 1
          maxLength: 24
          description: Player-selected display name without control characters
        score:
          type: integer
          minimum: 0
          maximum: 2147483647
        levelReached:
          type: integer
          minimum: 1
          maximum: 100000
        bossLevelReached:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
    RunScore:
      type: object
      additionalProperties: false
      required: [id, runId, name, score, levelReached, bossLevelReached, createdAt]
      properties:
        id:
          type: integer
        runId:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        name:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 2147483647
        levelReached:
          type: integer
          minimum: 1
          maximum: 100000
        bossLevelReached:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
        createdAt:
          type: string
          format: date-time
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    DriveTrack:
      type: object
      required: [id, title, size]
      properties:
        id:
          type: string
        title:
          type: string
        size:
          type: integer
          minimum: 1
          maximum: 25165824
    PlaylistSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    SavePlaylistInput:
      type: object
      additionalProperties: false
      required: [name, trackIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        trackIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
    SavedPlaylist:
      type: object
      required: [id, name, tracks]
      properties:
        id:
          type: string
        name:
          type: string
        tracks:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/DriveTrack"
    OwnerLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 256
    OwnerStatus:
      type: object
      required: [owner, configured]
      properties:
        owner:
          type: boolean
        configured:
          type: boolean
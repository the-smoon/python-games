kind = "web"
previewPath = "/"
title = "Rhythm Fighter"
description = "A music-driven top-down aerial shooter playable in the browser with mouse and touchscreen controls."
version = "1.0.0"
id = "artifacts/audiostrike"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20414

[services.development]
run = "pnpm --filter @workspace/audiostrike run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/audiostrike", "run", "build" ]
serve = "static"
publicDir = "artifacts/audiostrike/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20414"
BASE_PATH = "/"
